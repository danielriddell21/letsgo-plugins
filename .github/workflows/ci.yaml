name: CI

on:
  push:
    branches: ["trunk"]
  pull_request:

jobs:
  ci:
    uses: danielriddell21/github-actions/.github/workflows/ci.yaml@v1
    permissions:
      contents: write
    with:
      # Three small programs with no system dependencies and no display, so
      # the defaults cover everything else.
      vet: true

      # Off until there is a .gremlins.yaml to run against. These are three
      # pure functions from JSON to JSON; the tests assert the answers rather
      # than the code paths, which is what mutation testing would measure.
      mutate: false

      # Off until this repository has a LETSGO_PLUGINS_TOKEN secret. The job
      # needs a token that is not the workflow token, because a tag pushed
      # with GITHUB_TOKEN does not start another workflow — and starting the
      # release workflow is the entire point of pushing the tag. Until then a
      # release is tagged by hand.
      tag: false
    secrets:
      codecov-token: ${{ secrets.CODECOV_TOKEN }}
